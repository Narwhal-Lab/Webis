[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "webis"
version = "2.0.0-alpha.1"
description = "From Web to Wisdom: Your AI-Powered Knowledge Pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Webis Team", email = "contact@webis.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.9.0",
    "tenacity>=8.2.0",
    "click>=8.0.0",
    "rich>=10.0.0",
    "pyyaml>=6.0",
    "ddgs>=9.8.0",
    "scrapy>=2.11.0",
    "brightdata-sdk>=0.4.0",
    "docx2txt>=0.8",
    "pypdf>=3.0.0",
    "easyocr>=1.7.0",
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "webis-html",
    "streamlit>=1.28.0",
    "streamlit-chat>=0.1.0",
    "streamlit-aggrid>=0.3.0",
    "streamlit-ace>=0.1.0",
    "plotly>=5.17.0",
    "pyvis>=0.3.0",
    "networkx>=3.2.0",
    "pandas>=1.5.0,<2.0.0",
    "openpyxl>=3.1.0",
    "markdown>=3.5.0",
    # RAG Dependencies
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
    "transformers>=4.30.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
webis = "webis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=webis --cov-report=term-missing"
