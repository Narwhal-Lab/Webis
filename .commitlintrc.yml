extends:
  - conventionalcommits
rules:
  header-max-length: 72
  type-enum:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
    - wip
  subject-case:
    - always
    - sentence-case
    - case: lower
  subject-empty: [false]
  subject-full-stop: [false]
  type-case: [lower]
  scope-case: [lower]
  header-max-length: [72]
  body-leading-blank: [true]
  body-max-line-length: [100]
  footer-leading-blank: [true]
  footer-max-line-length: [100]